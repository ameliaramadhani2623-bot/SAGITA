<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAGITA - Posyandu Sokarini 2</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8FA;--card:#fff;--ink:#3b2a33;--mut:#7c6a73;--pk:#D63F7A;--tl:#1FA2A8;--tld:#147A7F;--yl:#FFE9A8;--mint:#E6F6F4;--line:#F1D9E3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1519;--card:#2a1e24;--ink:#f7e9ef;--mut:#c3aab5;--mint:#17383a;--line:#4a3540;--yl:#5a4a1c;--tld:#5fd0d5}}
:root[data-theme="dark"]{--bg:#1d1519;--card:#2a1e24;--ink:#f7e9ef;--mut:#c3aab5;--mint:#17383a;--line:#4a3540;--yl:#5a4a1c;--tld:#5fd0d5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,"Segoe UI",sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tl);outline-offset:2px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--pk) 0 38%,var(--bg) 38%)}
.lbox{background:var(--card);border-radius:28px;padding:28px;width:min(420px,100%);box-shadow:0 12px 40px rgba(214,63,122,.25);text-align:center}
.lbox img{width:140px;height:140px}
.lbox h1{margin:6px 0 0;font-size:2rem;font-weight:800;color:var(--pk);letter-spacing:.04em}
.lbox p{margin:0 0 16px;color:var(--tld);font-weight:600}
label{display:block;text-align:left;font-weight:600;font-size:.9rem;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.btn{background:var(--pk);color:#fff;border:0;border-radius:999px;padding:10px 20px;font-weight:800;cursor:pointer}
.btn.t{background:var(--tl)}.btn.o{background:transparent;color:var(--pk);border:2px solid var(--pk)}
.btn.sm{padding:5px 12px;font-size:.85rem}.btn:disabled{opacity:.4;cursor:default}.pager{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap;font-size:.9rem}.note{border-top:1px solid var(--line);padding:10px 0}
.err{background:#fde3ea;color:#a3123f;border-radius:10px;padding:8px 12px;margin-top:12px;font-weight:600;text-align:left}
.pw{position:relative}.pw input{padding-right:46px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;padding:6px;cursor:pointer;color:var(--mut);display:flex}.eye:hover{color:var(--pk)}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;margin-top:8px}.lg i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.lk{background:none;border:0;color:var(--pk);font-weight:700;cursor:pointer;text-decoration:underline;padding:4px}.who{display:flex;gap:8px;align-items:center;margin-top:auto}
.hint{font-size:.8rem;color:var(--mut);margin-top:14px;text-align:left}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav{background:var(--pk);color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:4px}
nav .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
nav .brand img{width:46px;height:46px;border-radius:50%;background:#fff}
nav .brand b{font-size:1.2rem;letter-spacing:.05em}
nav .brand small{display:block;color:var(--yl);font-weight:600;font-size:.72rem;letter-spacing:.12em}
nav button{background:none;border:0;color:#fff;text-align:left;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:600}
nav button:hover{background:rgba(255,255,255,.15)}
nav button.on{background:#fff;color:var(--pk);font-weight:800}
nav .out{margin-top:4px;background:rgba(0,0,0,.15)}
main{padding:24px;max-width:1000px;width:100%}
h2{margin:0 0 4px;font-size:1.6rem;color:var(--pk)}
.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--mint);border-radius:18px;padding:14px}
.stat b{display:block;font-size:1.9rem;color:var(--tld);line-height:1.1}
.stat.y{background:var(--yl)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--tld)}
.bd{display:inline-block;padding:2px 10px;border-radius:999px;color:#fff;font-weight:800;font-size:.8rem}
.buruk{background:#C62853}.kurang{background:#D9801A}.baik{background:#2E9E5B}.risiko{background:#D9A01A;color:#3b2a33}.lebih{background:#7B5EA7}.obes{background:#8E2E5E}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--tl)}
.res{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.res .bd{font-size:1.1rem;padding:6px 16px}
.pr{display:grid;grid-template-columns:110px 1fr 50px;gap:8px;align-items:center;font-size:.88rem;margin:4px 0}
.ok{color:#2E9E5B;font-weight:800}.wt{color:#D9801A;font-weight:800}
@media(max-width:760px){.app{grid-template-columns:1fr}nav{flex-direction:row;flex-wrap:wrap;position:sticky;top:0;z-index:5}nav .brand{width:100%;padding-bottom:4px}nav button{padding:6px 10px;font-size:.85rem}nav .out{margin:0}main{padding:16px}}
@media print{nav,.noprint{display:none!important}.app{display:block}.card{border:1px solid #999}main{padding:0;max-width:none}.tw{overflow:visible}table{font-size:10px}th,td{white-space:normal;padding:4px 5px}body{background:#fff;color:#000}}
